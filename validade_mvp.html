<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ValidaLOG Pro - Consolidado</title>
  <style>
    :root{
      --primary:#2563eb;
      --dark:#0f172a;
      --bg:#f1f5f9;
      --card:#ffffff;
      --border:#e2e8f0;
      --muted:#64748b;
      --success:#10b981;
      --warning:#f59e0b;
      --danger:#ef4444;
      --info:#0ea5e9;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      background:var(--bg);
      color:#0f172a;
    }

    header{
      background:linear-gradient(120deg, #0f172a, #1e3a8a);
      color:#fff;
      padding:24px 18px;
      box-shadow:0 2px 8px rgba(0,0,0,.10);
    }

    .wrap{
      max-width:1400px;
      margin:0 auto;
      padding:18px;
    }

    h1,h2,h3,p{ margin-top:0; }

    .sub{
      color:#dbeafe;
      font-size:13px;
      margin-top:6px;
      display:block;
    }

    .grid{
      display:grid;
      gap:14px;
    }

    .grid-stats{
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      margin-bottom:18px;
    }

    .grid-form{
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    }

    .panel, .card, .col{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 1px 3px rgba(0,0,0,.06);
    }

    .panel{
      padding:16px;
    }

    .stat small{
      color:var(--muted);
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.5px;
      display:block;
      margin-bottom:6px;
    }

    .stat b{
      font-size:30px;
      display:block;
      line-height:1.1;
    }

    .stat.total b{ color:var(--info); }
    .stat.ok b{ color:var(--success); }
    .stat.critico b{ color:var(--warning); }
    .stat.vencido b{ color:var(--danger); }

    .section-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:14px;
    }

    label{
      display:block;
      font-size:11px;
      font-weight:800;
      color:var(--muted);
      text-transform:uppercase;
      margin-bottom:6px;
      letter-spacing:.3px;
    }

    input, textarea{
      width:100%;
      padding:11px 12px;
      border:1px solid var(--border);
      border-radius:10px;
      outline:none;
      background:#fff;
      transition:.2s;
      font-size:14px;
    }

    input:focus, textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(37,99,235,.10);
    }

    textarea{
      resize:vertical;
      min-height:44px;
    }

    .span-2{
      grid-column:span 2;
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin:18px 0;
    }

    .toolbar-left{
      flex:1 1 420px;
      min-width:260px;
    }

    .toolbar-right{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:10px 14px;
      font-weight:800;
      cursor:pointer;
      transition:.2s;
      font-size:13px;
    }

    .btn:hover{
      filter:brightness(.97);
      transform:translateY(-1px);
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-light{
      background:#fff;
      color:#0f172a;
      border:1px solid var(--border);
    }

    .btn-danger{
      background:var(--danger);
      color:#fff;
    }

    .legend{
      color:var(--muted);
      font-size:12px;
      margin-top:6px;
    }

    .kanban{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
      gap:16px;
      align-items:start;
    }

    .col{
      padding:14px;
      background:#e2e8f0;
    }

    .col h3{
      margin:0 0 12px;
      font-size:15px;
      text-transform:uppercase;
      letter-spacing:.4px;
    }

    .items{
      min-height:60px;
    }

    .item{
      padding:14px;
      margin-bottom:12px;
      border-left:7px solid #cbd5e1;
      background:#fff;
      border-radius:12px;
      box-shadow:0 1px 2px rgba(0,0,0,.05);
      break-inside:avoid;
    }

    .item.EM_DIA{ border-left-color:var(--success); }
    .item.CRITICO{ border-left-color:var(--warning); }
    .item.VENCIDO{ border-left-color:var(--danger); }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:8px;
      flex-wrap:wrap;
    }

    .badge{
      font-size:10px;
      font-weight:900;
      background:#f1f5f9;
      border-radius:999px;
      padding:4px 8px;
      color:#334155;
      border:1px solid #e2e8f0;
    }

    .item-title{
      font-size:18px;
      font-weight:800;
      margin:10px 0 6px;
      word-break:break-word;
    }

    .muted{
      color:var(--muted);
      font-size:12px;
    }

    .progress{
      height:8px;
      background:#e5e7eb;
      border-radius:999px;
      overflow:hidden;
      margin:12px 0 10px;
    }

    .bar{
      height:100%;
    }

    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      font-size:12px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:10px;
      padding:10px;
      margin-bottom:10px;
    }

    .empty{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      padding:12px;
      border:1px dashed #cbd5e1;
      border-radius:10px;
      background:#f8fafc;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
      border-top:1px solid #f1f5f9;
      padding-top:10px;
    }

    .print-header{
      display:none;
      margin-bottom:18px;
      border-bottom:2px solid #cbd5e1;
      padding-bottom:10px;
    }

    .print-header h2{
      margin:0 0 6px;
    }

    .print-header small{
      color:#475569;
      font-size:12px;
    }

    @media (max-width: 800px){
      .span-2{
        grid-column:span 1;
      }
    }

    @media print{
      body{
        background:#fff;
      }

      header{
        background:#fff !important;
        color:#000 !important;
        box-shadow:none !important;
        border-bottom:2px solid #cbd5e1;
      }

      .no-print,
      .actions{
        display:none !important;
      }

      .print-header{
        display:block;
      }

      .wrap{
        max-width:none;
        padding:10px;
      }

      .grid-stats{
        grid-template-columns:repeat(4, 1fr);
      }

      .panel, .card{
        box-shadow:none !important;
      }

      .kanban{
        display:block;
      }

      .col{
        background:#fff !important;
        border:1px solid #cbd5e1;
        margin-bottom:16px;
        page-break-inside:avoid;
      }

      .item{
        border:1px solid #e5e7eb;
        margin-bottom:14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>ValidaLOG CD-PE - Gestão de Validade</h1>
      <small class="sub">Feito por João Victor </small>
    </div>
  </header>

  <main class="wrap">
    <div class="print-header">
      <h2>Relatório de Validade</h2>
      <small id="printInfo"></small>
    </div>

    <!-- PAINEL -->
    <section id="painel" class="grid grid-stats"></section>

    <!-- FORM -->
    <section class="panel no-print">
      <h2 class="section-title">Novo item</h2>
      <div class="grid grid-form">
        <div>
          <label for="nf">Nota Fiscal (opcional)</label>
          <input id="nf" type="text" placeholder="Ex.: NF-12345">
        </div>

        <div class="span-2">
          <label for="produto">Nome do produto *</label>
          <input id="produto" type="text" placeholder="Digite o nome do produto">
        </div>

        <div>
          <label for="fabricacao">Fabricação *</label>
          <input id="fabricacao" type="date">
        </div>

        <div>
          <label for="validade">Validade *</label>
          <input id="validade" type="date">
        </div>

        <div class="span-2">
          <label for="observacao">Observação</label>
          <textarea id="observacao" placeholder="Opcional"></textarea>
        </div>
      </div>

      <br>
      <button class="btn btn-primary" onclick="salvarItem()">Salvar item</button>
      <div class="legend">
        <strong>Obrigatórios:</strong> Produto, Fabricação e Validade. A <strong>Nota Fiscal é opcional</strong>.
      </div>
    </section>

    <!-- BUSCA + AÇÕES -->
    <div class="toolbar no-print">
      <div class="toolbar-left">
        <input
          id="busca"
          type="text"
          placeholder="Pesquisar por produto, NF ou observação..."
          oninput="render()"
        >
      </div>

      <div class="toolbar-right">
        <button class="btn btn-light" onclick="imprimirRelatorio()">Imprimir relatório</button>
        <button class="btn btn-light" onclick="exportarJSON()">Exportar JSON</button>
        <button class="btn btn-light" onclick="document.getElementById('importFile').click()">Importar JSON</button>
        <input id="importFile" type="file" accept=".json" style="display:none" onchange="importarJSON(event)">
      </div>
    </div>

    <!-- KANBAN -->
    <section class="kanban">
      <div class="col">
        <h3 style="color:var(--success)">🟢 Em dia</h3>
        <div id="colEmDia" class="items"></div>
      </div>

      <div class="col">
        <h3 style="color:var(--warning)">🟡 Crítico</h3>
        <div id="colCritico" class="items"></div>
      </div>

      <div class="col">
        <h3 style="color:var(--danger)">🔴 Vencido</h3>
        <div id="colVencido" class="items"></div>
      </div>
    </section>
  </main>

  <script>
    const DB_KEY = "validalog_pro_consolidado";

    const $ = (id) => document.getElementById(id);

    function esc(texto){
      return String(texto ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m]));
    }

    function hojeZeroHora(){
      const h = new Date();
      h.setHours(0,0,0,0);
      return h;
    }

    function parseDateBR(yyyyMmDd){
      if(!yyyyMmDd) return null;
      const [y, m, d] = yyyyMmDd.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setHours(0,0,0,0);
      return dt;
    }

    function formatDateBR(yyyyMmDd){
      const d = parseDateBR(yyyyMmDd);
      return d ? d.toLocaleDateString("pt-BR") : "-";
    }

    function getDados(){
      try{
        return JSON.parse(localStorage.getItem(DB_KEY) || "[]");
      }catch(e){
        return [];
      }
    }

    function salvarDados(lista){
      localStorage.setItem(DB_KEY, JSON.stringify(lista));
      render();
    }

    function calcularIndicadores(fabricacao, validade){
      const hoje = hojeZeroHora();
      const fab = parseDateBR(fabricacao);
      const val = parseDateBR(validade);

      if(!fab || !val){
        return {
          status: "VENCIDO",
          totalDias: 0,
          diasRestantes: 0,
          percentualConsumido: 100,
          limiteCritico: null
        };
      }

      const diffTotal = val - fab;
      const totalDias = Math.floor(diffTotal / 86400000);

      if (diffTotal <= 0) {
        return {
          status: "VENCIDO",
          totalDias: 0,
          diasRestantes: 0,
          percentualConsumido: 100,
          limiteCritico: val
        };
      }

      const diffRestante = val - hoje;
      const diasRestantes = Math.ceil(diffRestante / 86400000);
      const percentualConsumido = Math.min(
        Math.max(
          Math.floor(((hoje - fab) / diffTotal) * 100),
          0
        ),
        100
      );

      let status = "EM_DIA";
      if (hoje >= val) {
        status = "VENCIDO";
      } else if ((diffRestante / diffTotal) <= 0.3) {
        status = "CRITICO";
      }

      const margemCriticaDias = Math.floor(totalDias * 0.3);
      const limiteCritico = new Date(val);
      limiteCritico.setDate(val.getDate() - margemCriticaDias);

      return {
        status,
        totalDias,
        diasRestantes,
        percentualConsumido,
        limiteCritico
      };
    }

    function validarCampos(item){
      if(!item.produto || !item.fabricacao || !item.validade){
        return "Preencha os campos obrigatórios: Produto, Fabricação e Validade.";
      }

      const fab = parseDateBR(item.fabricacao);
      const val = parseDateBR(item.validade);

      if(!fab || !val){
        return "Datas inválidas.";
      }

      if(fab >= val){
        return "A data de fabricação deve ser menor que a validade.";
      }

      return "";
    }

    function existePossivelDuplicidade(item, lista){
      const nfNormalizada = (item.nf || "").trim().toUpperCase();
      const produtoNormalizado = (item.produto || "").trim().toUpperCase();

      return lista.some(x =>
        x.ativo !== false &&
        (x.produto || "").trim().toUpperCase() === produtoNormalizado &&
        x.fabricacao === item.fabricacao &&
        x.validade === item.validade &&
        ((x.nf || "").trim().toUpperCase() === nfNormalizada)
      );
    }

    function salvarItem(){
      const item = {
        id: crypto.randomUUID(),
        nf: $("nf").value.trim(),
        produto: $("produto").value.trim(),
        fabricacao: $("fabricacao").value,
        validade: $("validade").value,
        observacao: $("observacao").value.trim(),
        ativo: true,
        criadoEm: new Date().toISOString()
      };

      const erro = validarCampos(item);
      if(erro){
        alert(erro);
        return;
      }

      const lista = getDados();

      if(existePossivelDuplicidade(item, lista)){
        const continuar = confirm("Foi encontrada possível duplicidade para este item. Deseja salvar mesmo assim?");
        if(!continuar) return;
      }

      lista.push(item);
      salvarDados(lista);

      $("nf").value = "";
      $("produto").value = "";
      $("fabricacao").value = "";
      $("validade").value = "";
      $("observacao").value = "";
      $("produto").focus();
    }

    function inativarItem(id){
      const lista = getDados();
      const item = lista.find(x => x.id === id);
      if(!item) return;

      const ok = confirm("Deseja inativar este item? Ele sairá da contagem e do Kanban.");
      if(!ok) return;

      item.ativo = false;
      item.inativadoEm = new Date().toISOString();
      salvarDados(lista);
    }

    function getDadosFiltrados(){
      const termo = ($("busca")?.value || "").trim().toLowerCase();
      const lista = getDados().filter(x => x.ativo !== false);

      if(!termo) return lista;

      return lista.filter(x =>
        (x.produto || "").toLowerCase().includes(termo) ||
        (x.nf || "").toLowerCase().includes(termo) ||
        (x.observacao || "").toLowerCase().includes(termo)
      );
    }

    function montarPainel(contagem){
      $("painel").innerHTML = `
        <div class="panel stat total">
          <small>Total</small>
          <b>${contagem.total}</b>
        </div>
        <div class="panel stat ok">
          <small>Em dia</small>
          <b>${contagem.emDia}</b>
        </div>
        <div class="panel stat critico">
          <small>Crítico</small>
          <b>${contagem.critico}</b>
        </div>
        <div class="panel stat vencido">
          <small>Vencido</small>
          <b>${contagem.vencido}</b>
        </div>
      `;
    }

    function criarCard(item, info){
      const corBarra =
        info.status === "EM_DIA" ? "var(--success)" :
        info.status === "CRITICO" ? "var(--warning)" :
        "var(--danger)";

      const nfTexto = item.nf ? `NF ${esc(item.nf)}` : "NF não informada";
      const limiteCriticoTexto = info.limiteCritico
        ? info.limiteCritico.toLocaleDateString("pt-BR")
        : "-";

      const diasRestantesTexto =
        info.status === "VENCIDO"
          ? "Vencido"
          : `${info.diasRestantes} dia(s) restante(s)`;

      return `
        <div class="item ${info.status}">
          <div class="row">
            <span class="badge">${nfTexto}</span>
            <span class="badge">Status: ${info.status.replace("_", " ")}</span>
          </div>

          <div class="item-title">${esc(item.produto).toUpperCase()}</div>

          <div class="meta-grid">
            <div><strong>Fabricação:</strong><br>${formatDateBR(item.fabricacao)}</div>
            <div><strong>Validade:</strong><br>${formatDateBR(item.validade)}</div>
            <div><strong>Vida útil:</strong><br>${info.totalDias} dia(s)</div>
            <div><strong>Limite crítico:</strong><br>${limiteCriticoTexto}</div>
          </div>

          <div class="progress">
            <div class="bar" style="width:${info.percentualConsumido}%; background:${corBarra};"></div>
          </div>

          <div class="row">
            <small class="muted">Consumido: ${info.percentualConsumido}%</small>
            <small class="muted">${diasRestantesTexto}</small>
          </div>

          ${item.observacao ? `<p class="muted" style="margin-top:10px;">Obs.: ${esc(item.observacao)}</p>` : ""}

          <div class="actions no-print">
            <button class="btn btn-danger" onclick="inativarItem('${item.id}')">Inativar</button>
          </div>
        </div>
      `;
    }

    function render(){
      $("colEmDia").innerHTML = "";
      $("colCritico").innerHTML = "";
      $("colVencido").innerHTML = "";

      const lista = getDadosFiltrados()
        .sort((a,b) => parseDateBR(a.validade) - parseDateBR(b.validade));

      const contagem = {
        total: 0,
        emDia: 0,
        critico: 0,
        vencido: 0
      };

      lista.forEach(item => {
        const info = calcularIndicadores(item.fabricacao, item.validade);
        contagem.total++;

        if(info.status === "EM_DIA") contagem.emDia++;
        if(info.status === "CRITICO") contagem.critico++;
        if(info.status === "VENCIDO") contagem.vencido++;

        const html = criarCard(item, info);

        if(info.status === "EM_DIA") $("colEmDia").insertAdjacentHTML("beforeend", html);
        if(info.status === "CRITICO") $("colCritico").insertAdjacentHTML("beforeend", html);
        if(info.status === "VENCIDO") $("colVencido").insertAdjacentHTML("beforeend", html);
      });

      montarPainel(contagem);

      if (!lista.length) {
        $("colEmDia").innerHTML = `<div class="empty">Nenhum item encontrado.</div>`;
        $("colCritico").innerHTML = `<div class="empty">Nenhum item encontrado.</div>`;
        $("colVencido").innerHTML = `<div class="empty">Nenhum item encontrado.</div>`;
      }
    }

    function imprimirRelatorio(){
      const termo = ($("busca").value || "").trim();
      const agora = new Date();

      $("printInfo").textContent =
        `Gerado em ${agora.toLocaleDateString("pt-BR")} às ${agora.toLocaleTimeString("pt-BR")} ` +
        `${termo ? `| Filtro aplicado: "${termo}"` : "| Sem filtro"}`;

      window.print();
    }

    function exportarJSON(){
      const dados = getDados();
      const blob = new Blob([JSON.stringify(dados, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `validalog_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importarJSON(event){
      const file = event.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = function(e){
        try{
          const json = JSON.parse(e.target.result);

          if(!Array.isArray(json)){
            alert("Arquivo inválido. O JSON precisa conter uma lista de itens.");
            return;
          }

          localStorage.setItem(DB_KEY, JSON.stringify(json));
          alert("Importação concluída com sucesso.");
          render();
        }catch(err){
          alert("Não foi possível importar. Verifique se o arquivo JSON está correto.");
        }finally{
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    render();
  </script>
</body>
</html>
